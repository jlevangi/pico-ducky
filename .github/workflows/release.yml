name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'wifi'  # Allow testing on wifi branch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        pip install requests
        
    - name: Download CircuitPython UF2 files
      run: |
        mkdir -p dist
        
        # Download CircuitPython UF2 files
        wget -O dist/adafruit-circuitpython-raspberry_pi_pico-en_US-9.2.1.uf2 \
          "https://downloads.circuitpython.org/bin/raspberry_pi_pico/en_US/adafruit-circuitpython-raspberry_pi_pico-en_US-9.2.1.uf2"
        
        wget -O dist/adafruit-circuitpython-raspberry_pi_pico_w-en_US-9.2.1.uf2 \
          "https://downloads.circuitpython.org/bin/raspberry_pi_pico_w/en_US/adafruit-circuitpython-raspberry_pi_pico_w-en_US-9.2.1.uf2"
        
        wget -O dist/adafruit-circuitpython-raspberry_pi_pico2-en_US-9.2.1.uf2 \
          "https://downloads.circuitpython.org/bin/raspberry_pi_pico2/en_US/adafruit-circuitpython-raspberry_pi_pico2-en_US-9.2.1.uf2"
        
        wget -O dist/adafruit-circuitpython-raspberry_pi_pico2_w-en_US-9.2.1.uf2 \
          "https://downloads.circuitpython.org/bin/raspberry_pi_pico2_w/en_US/adafruit-circuitpython-raspberry_pi_pico2_w-en_US-9.2.1.uf2"
        
    - name: Fetch Latest CircuitPython Bundle URL
      id: fetch-bundle-url
      run: |
        API_URL="https://api.github.com/repos/adafruit/Adafruit_CircuitPython_Bundle/releases/latest"
        echo "Fetching API response from $API_URL..."
        RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" $API_URL)
        echo "API Response: $RESPONSE"
        BUNDLE_URL=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name | contains("adafruit-circuitpython-bundle-9.x-mpy.zip")) | .browser_download_url')
        if [ -z "$BUNDLE_URL" ]; then
          echo "Error: Failed to fetch the latest CircuitPython bundle URL. Check API response or authentication."
          exit 1
        fi
        echo "bundle_url=$BUNDLE_URL" >> $GITHUB_OUTPUT

    - name: Download CircuitPython Libraries
      run: |
        echo "Current working directory: $(pwd)"
        echo "Contents before download: $(ls -la)"
        
        # Use the dynamically fetched URL to download the latest CircuitPython bundle
        wget -O bundle.zip "${{ steps.fetch-bundle-url.outputs.bundle_url }}" || {
          echo "Error: Failed to download CircuitPython bundle. Check the URL or network connection.";
          exit 1;
        }

        # Extract and setup lib directory
        unzip bundle.zip
        bundle_dir=$(ls -d adafruit-circuitpython-bundle-*)
        echo "Bundle directory: $bundle_dir"
        
        # Create lib directory and copy required libraries
        mkdir -p lib
        echo "Created lib directory"
        
        # Copy libraries with error checking
        if [ -d "${bundle_dir}/lib/adafruit_hid" ]; then
          cp -r "${bundle_dir}/lib/adafruit_hid" lib/
          echo "Copied adafruit_hid"
        else
          echo "Warning: adafruit_hid not found"
        fi
        
        if [ -f "${bundle_dir}/lib/adafruit_debouncer.mpy" ]; then
          cp "${bundle_dir}/lib/adafruit_debouncer.mpy" lib/
          echo "Copied adafruit_debouncer.mpy"
        else
          echo "Warning: adafruit_debouncer.mpy not found"
        fi
        
        if [ -f "${bundle_dir}/lib/adafruit_ticks.mpy" ]; then
          cp "${bundle_dir}/lib/adafruit_ticks.mpy" lib/
          echo "Copied adafruit_ticks.mpy"
        else
          echo "Warning: adafruit_ticks.mpy not found"
        fi
        
        if [ -d "${bundle_dir}/lib/asyncio" ]; then
          cp -r "${bundle_dir}/lib/asyncio" lib/
          echo "Copied asyncio"
        else
          echo "Warning: asyncio not found"
        fi
        
        if [ -d "${bundle_dir}/lib/adafruit_wsgi" ]; then
          cp -r "${bundle_dir}/lib/adafruit_wsgi" lib/
          echo "Copied adafruit_wsgi"
        else
          echo "Warning: adafruit_wsgi not found"
        fi
        
        # Verify lib directory was created properly
        echo "Contents of lib directory after copy:"
        ls -la lib/
        
        # Clean up
        rm bundle.zip
        rm -rf adafruit-circuitpython-bundle-*
        
        echo "Final lib directory contents:"
        ls -la lib/
        
    - name: Verify lib Directory
      run: |
        if [ ! -d "lib" ]; then
          echo "Error: 'lib' directory is missing. Ensure the libraries are downloaded correctly."
          exit 1
        fi

    - name: Debug lib Directory
      run: |
        echo "Contents of lib directory:"
        ls -l lib

    - name: Debug After Download
      run: |
        echo "Checking if 'lib' directory exists after download..."
        if [ ! -d "lib" ]; then
          echo "Error: 'lib' directory is missing after download step."
          exit 1
        fi
        echo "Contents of 'lib' directory after download:"
        ls -l lib
        
    - name: Create release bundles
      run: |
        # Set version from tag or input
        VERSION=${GITHUB_REF#refs/tags/}
        if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
          # If not a tag, use branch name and timestamp
          VERSION="${GITHUB_REF#refs/heads/}-$(date +%Y%m%d-%H%M%S)"
        fi
        echo "Building release for version: $VERSION"
        
        # Verify lib directory exists before proceeding
        if [ ! -d "lib" ]; then
          echo "Error: 'lib' directory is missing. Cannot proceed with bundle creation."
          echo "Current directory contents:"
          ls -la
          exit 1
        fi
        
        echo "Contents of lib directory before bundling:"
        ls -la lib/
        
        # Create release bundles for each board
        boards=("raspberry_pi_pico" "raspberry_pi_pico_w" "raspberry_pi_pico2" "raspberry_pi_pico2_w")
        
        for board in "${boards[@]}"; do
          echo "Creating bundle for $board..."
          
          # Create bundle directory
          bundle_dir="pico-ducky-$VERSION-$board"
          mkdir -p "$bundle_dir"
          
          # Copy source files
          cp *.py "$bundle_dir/" 2>/dev/null || echo "No .py files found"
          
          # Copy lib directory with verification
          if [ -d "lib" ]; then
            cp -r lib "$bundle_dir/"
            echo "Copied lib directory to $bundle_dir"
          else
            echo "Error: lib directory not found for $board"
            exit 1
          fi
          
          cp *.md "$bundle_dir/" 2>/dev/null || echo "No .md files found"
          
          # Copy examples if they exist
          if [ -d "examples" ]; then
            cp -r examples "$bundle_dir/"
          fi
          
          # Copy the UF2 file for this board
          uf2_file="dist/adafruit-circuitpython-$board-en_US-9.2.1.uf2"
          if [ -f "$uf2_file" ]; then
            cp "$uf2_file" "$bundle_dir/"
          fi
          
          # Create installation instructions
          cat > "$bundle_dir/INSTALL.txt" << 'EOF'
        Pico-Ducky Installation Instructions
        
        1. Connect your Raspberry Pi Pico while holding the BOOTSEL button
        2. Device appears as USB drive "RPI-RP2"
        3. Copy the .uf2 file to RPI-RP2
        4. Device reboots and appears as "CIRCUITPY"
        5. Copy all .py files to CIRCUITPY root
        6. Copy lib folder to CIRCUITPY root
        7. Edit secrets.py for WiFi settings
        8. Safely eject and run
        
        See README.md for detailed setup
        See WIFI_GUIDE.md for WiFi configuration
        EOF
          
          # Create ZIP bundle
          zip -r "dist/pico-ducky-$VERSION-$board.zip" "$bundle_dir"
          
          echo "Created: pico-ducky-$VERSION-$board.zip"
        done
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/*.zip
          dist/*.uf2
        name: Release ${{ github.ref_name }}
        body: |
          ## Pico-Ducky Release ${{ github.ref_name }}
          
          ### Features
          - WiFi Client Mode: Connect to home network
          - WiFi AP Mode: Create hotspot (original behavior)
          - Automatic fallback if client connection fails
          - Enhanced web interface
          - Backward compatibility
          
          ### Installation
          1. Download bundle for your board
          2. Extract ZIP file
          3. Follow INSTALL.txt instructions
          4. Configure WiFi in secrets.py
          
          ### Supported Boards
          - Raspberry Pi Pico
          - Raspberry Pi Pico W  
          - Raspberry Pi Pico 2
          - Raspberry Pi Pico 2 W
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pico-ducky-release-artifacts
        path: dist/*
